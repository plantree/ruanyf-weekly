name: "weekly deploy"
on:
  push:
    branches:
      - main
  schedule:
    # Friday 08:37 and 10:37 Beijing time (UTC+8); actual starts may be delayed.
    - cron: "37 0 * * 5"
    - cron: "37 2 * * 5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update
        run: |
          date "+%Y-%m-%d %H:%M:%S" >> actions.txt
          today=`date +"%Y-%m-%d"`
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git add .
          git commit -m "[${today}] done"
          git push
